server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── SPA 라우팅 폴백 (필수) ──────────────────────
  # react-router 는 /about, /movies/123 같은 경로를 브라우저에서 처리합니다.
  # 이 설정이 없으면 그 주소로 새로고침·직접 접속할 때 nginx 가 404 를 냅니다.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── 캐시 정책 ───────────────────────────────────
  # Vite 산출물은 파일명에 해시가 붙습니다(index-abc123.js).
  # 내용이 바뀌면 파일명이 바뀌므로 오래 캐시해도 안전합니다.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # index.html 은 해시가 없으므로 캐시하면 배포가 반영되지 않습니다.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # ── 압축 ────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml;

  # ── 기본 보안 헤더 ──────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
